name: Trigger auto deployment for banking

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/banking-AutoDeployTrigger-e130c9d1-e729-4a1f-93e2-beb942698eec.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.BANKING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BANKING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BANKING_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: mysmartbank.azurecr.io
          registryUsername: ${{ secrets.BANKING_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BANKING_REGISTRY_PASSWORD }}
          containerAppName: banking
          resourceGroup: Banking-Ai_group
          imageToBuild: mysmartbank.azurecr.io/banking:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


