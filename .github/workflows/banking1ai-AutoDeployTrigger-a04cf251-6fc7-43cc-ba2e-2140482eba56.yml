name: Trigger auto deployment for banking1ai

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/banking1ai-AutoDeployTrigger-a04cf251-6fc7-43cc-ba2e-2140482eba56.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.BANKING1AI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BANKING1AI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BANKING1AI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.BANKING1AI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BANKING1AI_REGISTRY_PASSWORD }}
          containerAppName: banking1ai
          resourceGroup: bank
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


