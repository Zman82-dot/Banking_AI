name: Trigger auto deployment for bank

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/bank-AutoDeployTrigger-ce22849f-a275-4fd8-8318-8711d0d73d4f.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.BANK_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BANK_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BANK_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.BANK_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BANK_REGISTRY_PASSWORD }}
          containerAppName: bank
          resourceGroup: Banking-Ai_group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


